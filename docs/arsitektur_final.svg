<!-- ===== 2. JUDUL DAN LABEL TIER ===== -->
<text x="30" y="38" font-size="20" font-weight="bold" fill="#1a1a1a">Arsitektur Flowbeat</text>
<text x="30" y="60" font-size="12" fill="#666">Alur tulis dari perangkat ke basis data (kiri) dan alur baca untuk pemantauan (kanan)</text>
<text x="46" y="102" font-size="14" font-weight="bold" fill="#333">Device Tier</text>
<text x="674" y="102" font-size="11" font-style="italic" fill="#888" text-anchor="end">Omron, Bluetooth Low Energy</text>
<text x="726" y="102" font-size="14" font-weight="bold" fill="#333">Presentation Tier</text>
<text x="726" y="117" font-size="10" font-style="italic" fill="#888">modul paralel, di luar evaluasi</text>
<text x="46" y="246" font-size="14" font-weight="bold" fill="#333">Gateway Tier · Bridge Station</text>
<text x="674" y="246" font-size="11" font-style="italic" fill="#888" text-anchor="end">Python · FastAPI · omblepy + bleak</text>
<text x="46" y="556" font-size="14" font-weight="bold" fill="#333">Logic Tier · Laravel 11 (PHP 8.2)</text>
<text x="800" y="556" font-size="11" font-style="italic" fill="#888" text-anchor="end">php artisan serve · port 8080</text>
<text x="46" y="988" font-size="14" font-weight="bold" fill="#333">Data Tier · MySQL (XAMPP)</text>

